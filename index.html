<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesin Slot Autopilot 5-Reel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="user-profile-section">
            <button class="control-btn" onclick="toggleProfileModal(true)">👤 PROFIL AMAN</button>
        </div>
        
        <button id="admin-gate-btn" onclick="window.location.href='admin.html'" style="display: none; background: linear-gradient(180deg, #ffd700 0%, #b39274 100%); color: #000; border: 2px solid #fff; padding: 8px 16px; font-weight: bold; font-size: 12px; border-radius: 4px; cursor: pointer; box-shadow: 0 0 12px rgba(255,215,0,0.5); margin-right: 10px; transition: transform 0.2s;">
            👑 PANEL ADMIN
        </button>

        <button class="control-btn logout-btn" onclick="handleLogout()">🚪 KELUAR</button>
    </div>

    <div class="jackpot-container">
        <div class="jackpot-title">GRAND JACKPOT</div>
        <div id="grand-counter" class="jackpot-value">RM 50,000.00</div>
    </div>

    <div id="fs-banner" class="free-spin-banner" style="display: none;">
        BONUS FREE SPIN AKTIF! BAKI: <span id="fs-count">0</span> | GANDAAN X2
    </div>

    <div class="slot-machine">
        <canvas id="line-canvas"></canvas>
        <div class="reel-container">
            <div class="reel" id="reel-0">
                <div class="cell" id="c-0-0">🐉</div>
                <div class="cell" id="c-0-1">👑</div>
                <div class="cell" id="c-0-2">💎</div>
            </div>
            <div class="reel" id="reel-1">
                <div class="cell" id="c-1-0">💰</div>
                <div class="cell" id="c-1-1">🍊</div>
                <div class="cell" id="c-1-2">7️⃣</div>
            </div>
            <div class="reel" id="reel-2">
                <div class="cell" id="c-2-0">BAR</div>
                <div class="cell" id="c-2-1">🍒</div>
                <div class="cell" id="c-2-2">🐢</div>
            </div>
            <div class="reel" id="reel-3">
                <div class="cell" id="c-3-0">👑</div>
                <div class="cell" id="c-3-1">💎</div>
                <div class="cell" id="c-3-2">🐉</div>
            </div>
            <div class="reel" id="reel-4">
                <div class="cell" id="c-4-0">7️⃣</div>
                <div class="cell" id="c-4-1">💰</div>
                <div class="cell" id="c-4-2">🍊</div>
            </div>
        </div>
    </div>

    <div id="win-message" class="system-message">MEMUATKAN KREDIT...</div>

    <div class="control-panel">
        <div class="panel-info">
            <span class="label">SALDO</span>
            <div class="value-box">RM <span id="display-balance">0.00</span></div>
        </div>

        <div class="panel-info">
            <span class="label">LINES</span>
            <div class="control-group">
                <button class="adjust-btn" onclick="changeLines(-1)">-</button>
                <div class="value-box text-center"><span id="display-lines">21</span></div>
                <button class="adjust-btn" onclick="changeLines(1)">+</button>
            </div>
        </div>

        <div class="panel-info">
            <span class="label">BET / LINE</span>
            <div class="control-group">
                <button class="adjust-btn" onclick="changeBet(-0.10)">-</button>
                <div class="value-box text-center">RM <span id="display-bet">0.20</span></div>
                <button class="adjust-btn" onclick="changeBet(0.10)">+</button>
            </div>
        </div>

        <div class="panel-info">
            <span class="label">TOTAL BET</span>
            <div class="value-box highlight-yellow">RM <span id="display-total-bet">4.20</span></div>
        </div>

        <div class="panel-info">
            <span class="label">WINNER PAID</span>
            <div class="value-box highlight-green">RM <span id="display-win">0.00</span></div>
        </div>

        <div class="spin-actions">
            <div class="auto-select-wrapper">
                <select id="auto-spin-count">
                    <option value="10">10 AUTO</option>
                    <option value="25">25 AUTO</option>
                    <option value="50">50 AUTO</option>
                    <option value="999">INF AUTO</option>
                </select>
                <button id="auto-btn" onclick="toggleAutoSpin()">AUTO PLAY</button>
            </div>
            <button id="spin-btn" onclick="startSpin()">SPIN</button>
        </div>
    </div>
</div>

<div id="profile-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>MAKLUMAT PEMAIN SECARA LIVE</h3>
        <hr style="border-color:#333; margin:10px 0;">
        <p>Username: <span id="prof-username" style="color:#ffd700;">-</span></p>
        <p>Email: <span id="prof-email" style="color:#fff;">-</span></p>
        <p>UID Akaun: <span id="prof-uid" style="color:#00ffcc; font-family:monospace; font-size:11px;">-</span></p>
        <button class="modal-close-btn" onclick="toggleProfileModal(false)">TUTUP WINDOW</button>
    </div>
</div>

<div id="big-win-overlay" class="big-win-modal" style="display: none;">
    <div class="big-win-content">
        <h1 class="flash-text">✨ BIG WIN ✨</h1>
        <div id="overlay-amount" class="win-amount">RM 0.00</div>
        <button class="collect-btn" onclick="closeOverlay()">AMBIL KREDIT</button>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
