<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Empire - Akses Masuk</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2>👑 GOLDEN EMPIRE 👑</h2>
            <p id="auth-subtitle">Sila log masuk untuk bermain</p>
        </div>

        <div id="auth-message" class="auth-msg" style="display: none;"></div>

        <form id="auth-form" onsubmit=\"handleAuth(event)\">
            <div class="input-group" id="username-group" style="display: none;">
                <label>USERNAME UNIK</label>
                <input type="text" id="auth-username" placeholder="contoh: player99">
            </div>

            <div class="input-group">
                <label id="identity-label">EMEL / USERNAME / PLAYER ID</label>
                <input type="text" id="auth-identity" required placeholder="Masukkan pengenalan akaun anda">
            </div>
            
            <div class="input-group">
                <label>KATA LALUAN</label>
                <input type="password" id="auth-password" required placeholder="Minima 6 aksara">
            </div>

            <button type="submit" id="submit-btn" class="btn-auth">LOG MASUK KABINET</button>
        </form>

        <div class="auth-footer">
            <p id="toggle-text">Belum ada akaun pemain? <a href="#" onclick="toggleMode(event)">Daftar ID Baru</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // Di kemas kini bagi memuatkan fungsi query, orderByChild, dan equalTo
        import { getDatabase, ref, get, set, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGIC0uvxEnAP2bpGnHi7BADI1y6cqorOI",
            authDomain: "webgame-c1f7d.firebaseapp.com",
            projectId: "webgame-c1f7d",
            storageBucket: "webgame-c1f7d.firebasestorage.app",
            messagingSenderId: "577183643543",
            appId: "1:577183643543:web:6444105e46ecd349b876d2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app, "https://webgame-c1f7d-default-rtdb.firebaseio.com/");

        let isRegister = false;

        window.toggleMode = function(e) {
            e.preventDefault();
            isRegister = !isRegister;
            
            const subtitle = document.getElementById('auth-subtitle');
            const usernameGroup = document.getElementById('username-group');
            const identityLabel = document.getElementById('identity-label');
            const identityInput = document.getElementById('auth-identity');
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const msgBox = document.getElementById('auth-message');

            msgBox.style.display = 'none';

            if (isRegister) {
                subtitle.textContent = "Pendaftaran Akaun Slot Baharu";
                usernameGroup.style.display = 'block';
                document.getElementById('auth-username').required = true;
                identityLabel.textContent = "ALAMAT EMEL PEMAIN";
                identityInput.type = "email";
                identityInput.placeholder = "contoh: player@gmail.com";
                submitBtn.textContent = "DAFTAR & DAPAT KREDIT";
                toggleText.innerHTML = `Dah ada ID berdaftar? <a href="#" onclick="toggleMode(event)">Log Masuk Sini</a>`;
            } else {
                subtitle.textContent = "Sila log masuk untuk bermain";
                usernameGroup.style.display = 'none';
                document.getElementById('auth-username').required = false;
                identityLabel.textContent = "EMEL / USERNAME / PLAYER ID";
                identityInput.type = "text";
                identityInput.placeholder = "Masukkan pengenalan akaun anda";
                submitBtn.textContent = "LOG MASUK KABINET";
                toggleText.innerHTML = `Belum ada akaun pemain? <a href="#" onclick="toggleMode(event)">Daftar ID Baru</a>`;
            }
        }

        window.handleAuth = async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;

            const identity = document.getElementById('auth-identity').value.trim();
            const password = document.getElementById('auth-password').value;
            const usernameRaw = document.getElementById('auth-username').value.trim();

            if (!isRegister) {
                showMsg("Menyemak rekod akaun...", "loading");
                
                let targetEmail = identity;

                // JIKALAU INPUT BUKAN EMEL (PROSES LOG MASUK MENGGUNAKAN USERNAME)
                if (!identity.includes('@')) {
                    try {
                        // Menggunakan Query Indeks secara spesifik mengikut parameter username (Lebih laju & mengelakkan sangkut)
                        const walletsRef = ref(db, 'wallets');
                        const usernameQuery = query(walletsRef, orderByChild('username'), equalTo(identity));
                        const snapshot = await get(usernameQuery);

                        if (snapshot.exists()) {
                            const usersData = snapshot.val();
                            // Ambil rekod emel pertama yang dipadankan dengan data username
                            const firstUid = Object.keys(usersData)[0];
                            targetEmail = usersData[firstUid].email;
                        } else {
                            submitBtn.disabled = false;
                            showMsg("Ralat: Username atau ID tidak wujud dalam kabinet.", "error");
                            return;
                        }
                    } catch (error) {
                        console.error("Ralat semakan log masuk:", error);
                        submitBtn.disabled = false;
                        showMsg("Ralat pangkalan data semasa menyemak akaun.", "error");
                        return;
                    }
                }

                // Pelaksanaan Log Masuk terus ke sistem Firebase Auth
                signInWithEmailAndPassword(auth, targetEmail, password)
                    .then(() => {
                        showMsg("Akses disahkan! Membuka kabinet...", "success");
                        setTimeout(() => { window.location.href = "index.html"; }, 1200);
                    })
                    .catch((error) => {
                        submitBtn.disabled = false;
                        showMsg("Gagal: " + translateError(error.code), "error");
                    });

            } else {
                showMsg("Menyemak ID/Username...", "loading");

                if (usernameRaw.length < 3) {
                    submitBtn.disabled = false;
                    showMsg("Username mestilah sekurang-kurangnya 3 aksara.", "error");
                    return;
                }

                try {
                    // Semakan pendaftaran: Pastikan username tidak bertindih dengan pemain sedia ada
                    const walletsRef = ref(db, 'wallets');
                    const usernameQuery = query(walletsRef, orderByChild('username'), equalTo(usernameRaw));
                    const snapshot = await get(usernameQuery);

                    if (snapshot.exists()) {
                        submitBtn.disabled = false;
                        showMsg("Username sudah digunakan. Sila pilih nama lain.", "error");
                        return;
                    }
                } catch (error) {
                    console.error("Ralat ketika semakan pendaftaran:", error);
                    submitBtn.disabled = false;
                    showMsg("Ralat pangkalan data semasa pendaftaran.", "error");
                    return;
                }

                // Proses Pendaftaran Pengguna Baharu ke Firebase Auth & Database
                createUserWithEmailAndPassword(auth, identity, password)
                    .then(async (userCredential) => {
                        const user = userCredential.user;
                        const userWalletRef = ref(db, 'wallets/' + user.uid);
                        
                        await set(userWalletRef, {
                            email: identity,
                            username: usernameRaw,
                            balance: 1000.00,
                            status: "active" // Default status ditambahkan bersandarkan kepada keperluan admin panel
                        });

                        showMsg("Pendaftaran berjaya! Membuka game...", "success");
                        setTimeout(() => { window.location.href = "index.html"; }, 1500);
                    })
                    .catch((error) => {
                        submitBtn.disabled = false;
                        showMsg("Gagal: " + translateError(error.code), "error");
                    });
            }
        }

        function showMsg(text, type) {
            const msgBox = document.getElementById('auth-message');
            msgBox.textContent = text;
            msgBox.className = `auth-msg ${type}`;
            msgBox.style.display = 'block';
        }

        function translateError(code) {
            switch(code) {
                case 'auth/invalid-credential': return 'Pengenalan atau kata laluan salah.';
                case 'auth/email-already-in-use': return 'Alamat emel ini sudah berdaftar.';
                case 'auth/weak-password': return 'Kata laluan mestilah sekurang-kurangnya 6 aksara.';
                case 'auth/invalid-email': return 'Format emel tidak sah.';
                default: return 'Ralat sistem. Sila cuba lagi.';
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.href = "index.html"; }
        });
    </script>
</body>
</html>
