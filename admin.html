<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Empire - Panel Pentadbir (Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h1 { color: #ffd700; }
        .stats-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1e1e1e; padding: 15px; border-radius: 8px; flex: 1; border: 1px solid #333; }
        .stat-card h3 { color: #888; font-size: 12px; margin-bottom: 5px; }
        .stat-card p { font-size: 24px; font-weight: bold; color: #00ff55; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #2a2a2a; color: #ffd700; font-size: 14px; }
        tr:hover { background-color: #252525; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-right: 5px; }
        .btn-add { background: #00c853; color: #fff; }
        .btn-deduct { background: #ff8c00; color: #fff; }
        .btn-ban { background: #d32f2f; color: #fff; }
        .btn-unban { background: #4a4a4a; color: #fff; }
        .btn-email { background: #00ccff; color: #000; }
        .status-banned { color: #ff4444; font-weight: bold; }
        .status-active { color: #00ff55; }
        
        /* Modal Style */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #222; padding: 25px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #444; }
        .modal-content h3 { margin-bottom: 15px; color: #ffd700; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>👑 SYSTEM ADMIN PANEL</h1>
            <button class="btn" style="background:#444; color:#fff;" onclick="location.reload()">REFRESH DATA</button>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <h3>JUMLAH PEMAIN</h3>
                <p id="total-players">0</p>
            </div>
            <div class="stat-card">
                <h3>KESELURUHAN DEPOSIT (RM)</h3>
                <p id="total-vault">0.00</p>
            </div>
        </div>

        <h2>SENARAI PENGGUNA WEBSITE</h2>
        <div style="overflow-x: auto; margin-top: 15px;">
            <table>
                <thead>
                    <tr>
                        <th>PLAYER ID (UID)</th>
                        <th>USERNAME</th>
                        <th>EMEL</th>
                        <th>BAL KREDIT (RM)</th>
                        <th>STATUS</th>
                        <th>TINDAKAN KAWALAN</th>
                    </tr>
                </thead>
                <tbody id="player-table-body">
                    <tr>
                        <td colspan="6" style="text-align:center; color:#888;">Memuatkan pangkalan data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="admin-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Tindakan</h3>
            <div id="modal-body-content"></div>
            <div class="modal-actions">
                <button class="btn" style="background:#555; color:#fff;" onclick="closeModal()">BATAL</button>
                <button class="btn btn-add" id="modal-confirm-btn" onclick="executeModalAction()">SAHKAN</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
