<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Empire - Panel Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto; padding: 20px; font-family: Arial, sans-serif; }
        .admin-box { background: #1a0000; border: 3px solid #ffd700; border-radius: 12px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 0 20px rgba(255,215,0,0.2); }
        h2, h3 { color: #ffd700; margin-bottom: 15px; text-align: center; }
        .section { background: #000; border: 1px solid #33211b; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: #a18e6e; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; background: #111; border: 1px solid #8b6508; border-radius: 4px; padding: 8px; color: #fff; margin-bottom: 10px; }
        .btn-adm { background: linear-gradient(180deg, #ffd700 0%, #b8860b 100%); border: none; color: #000; font-weight: bold; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-danger { background: linear-gradient(180deg, #ff4500 0%, #7f0000 100%); color: #fff; }
        .status-msg { text-align: center; font-weight: bold; margin-top: 10px; font-size: 13px; }
        .player-info { background: #222; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #00ffcc; margin-top: 10px; display: none; }
        .btn-back { background: #444; color: #fff; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>👑 UTILITY MANAGEMENT PANEL 👑</h2>
        <div id="status" class="status-msg" style="color: #ffd700;">Mengesahkan identiti admin...</div>

        <div id="admin-content" style="display: none;">
            <div class="section">
                <h3>💰 BUDGET HARIAN SYSTEM</h3>
                <label>SET BUDGET UNTUK AGIHAN KEMENANGAN (RM)</label>
                <input type="number" id="global-budget" placeholder="Contoh: 5000">
                <button class="btn-adm" onclick="updateBudget()">KEMASKINI BUDGET</button>
            </div>

            <div class="section">
                <h3>👤 PLAYER UTILITIES</h3>
                <label>MASUKKAN USERNAME / PLAYER ID</label>
                <input type="text" id="target-player" placeholder="Contoh: player99 atau UID">
                <button class="btn-adm" onclick="searchPlayer()">CARI PLAYER</button>

                <div id="player-data" class="player-info"></div>

                <div id="player-actions" style="display: none; margin-top: 15px;">
                    <label>AMBILI TINDAKAN BALANSA (RM)</label>
                    <input type="number" id="amount-change" placeholder="Masukkan jumlah nilai (e.g. 100)">
                    <div style="display:flex; gap: 10px; margin-bottom: 10px;">
                        <button class="btn-adm" onclick="adjustBalance('add')" style="background: #1e7d1e; color:#fff;">+ TAMBAH</button>
                        <button class="btn-adm" onclick="adjustBalance('deduct')" style="background: #7f0000; color:#fff;">- TOLAK</button>
                    </div>

                    <label>STATUS AKAUN</label>
                    <button id="ban-btn" class="btn-adm btn-danger" onclick="toggleBanStatus()">BAN PLAYER</button>
                </div>
            </div>
            
            <button class="btn-adm btn-back" onclick="window.location.href='index.html'">KEMBALI KE GAME</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGIC0uvxEnAP2bpGnHi7BADI1y6cqorOI",
            authDomain: "webgame-c1f7d.firebaseapp.com",
            projectId: "webgame-c1f7d",
            storageBucket: "webgame-c1f7d.firebasestorage.app",
            messagingSenderId: "577183643543",
            appId: "1:577183643543:web:6444105e46ecd349b876d2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app, "https://webgame-c1f7d-default-rtdb.firebaseio.com/");

        let currentAdminUID = null;
        let activePlayerUID = null;
        let activePlayerStatus = false; 

        // 1. Sekatan Hak Akses Halaman
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "auth.html";
                return;
            }
            
            const adminCheck = await get(ref(db, 'admins/' + user.uid));
            if (!adminCheck.exists()) {
                alert("Akses Ditolak! Anda bukan admin.");
                window.location.href = "index.html";
            } else {
                currentAdminUID = user.uid;
                document.getElementById('status').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadCurrentBudget();
            }
        });

        // 2. Baca & Set Budget Sistem
        async function loadCurrentBudget() {
            const budgetSnap = await get(ref(db, 'system_budget'));
            if (budgetSnap.exists()) {
                document.getElementById('global-budget').value = budgetSnap.val().dailyBudget || 0;
            }
        }

        window.updateBudget = async function() {
            const budgetVal = parseFloat(document.getElementById('global-budget').value);
            if (isNaN(budgetVal) || budgetVal < 0) return alert("Sila masukkan nilai budget sah.");
            
            await update(ref(db, 'system_budget'), { dailyBudget: budgetVal });
            alert("Budget harian sistem berjaya diperbaharui!");
        }

        // 3. Utiliti Cari Pemain
        window.searchPlayer = async function() {
            const input = document.getElementById('target-player').value.trim();
            if(!input) return alert("Sila isi input carian.");

            let targetUID = input;
            
            if (!input.includes('@') && input.length < 20) {
                const cleanKey = input.toLowerCase().replace(/[^a-z0-9]/g, "");
                const userSnap = await get(ref(db, 'usernames/' + cleanKey));
                if (userSnap.exists()) {
                    targetUID = userSnap.val().uid;
                }
            }

            const walletSnap = await get(ref(db, 'wallets/' + targetUID));
            if (walletSnap.exists()) {
                const data = walletSnap.val();
                activePlayerUID = targetUID;
                activePlayerStatus = data.isBanned || false;

                const displayBox = document.getElementById('player-data');
                displayBox.style.display = 'block';
                displayBox.innerHTML = `
                    UID: ${targetUID}<br>
                    USERNAME: ${data.username || 'N/A'}<br>
                    EMAIL: ${data.email}<br>
                    BAKI SEMASA: RM ${parseFloat(data.balance).toFixed(2)}<br>
                    STATUS: ${activePlayerStatus ? '<span style="color:red">BANNED</span>' : '<span style="color:green">AKTIF</span>'}
                `;

                document.getElementById('ban-btn').textContent = activePlayerStatus ? "UNBAN PLAYER" : "BAN PLAYER";
                document.getElementById('player-actions').style.display = 'block';
            } else {
                alert("Pemain tidak dijumpai.");
                document.getElementById('player-data').style.display = 'none';
                document.getElementById('player-actions').style.display = 'none';
            }
        }

        // 4. Tambah / Tolak Kredit Dompet
        window.adjustBalance = async function(type) {
            if(!activePlayerUID) return;
            const amount = parseFloat(document.getElementById('amount-change').value);
            if(isNaN(amount) || amount <= 0) return alert("Sila masukkan jumlah nilai yang betul.");

            const walletRef = ref(db, 'wallets/' + activePlayerUID);
            const snap = await get(walletRef);
            
            if(snap.exists()) {
                let currentBalance = parseFloat(snap.val().balance);
                let newBalance = type === 'add' ? currentBalance + amount : currentBalance - amount;
                
                if (newBalance < 0) newBalance = 0;

                await update(walletRef, { balance: parseFloat(newBalance.toFixed(2)) });
                alert(`Berjaya melakukan ${type} balansa!`);
                searchPlayer(); // Refresh info
            }
        }

        // 5. Fungsi Ban / Unban Pemain
        window.toggleBanStatus = async function() {
            if(!activePlayerUID) return;
            const nextStatus = !activePlayerStatus;
            
            if(confirm(`Adakah anda pasti mahu ubah status sekatan pemain ini?`)) {
                await update(ref(db, 'wallets/' + activePlayerUID), { isBanned: nextStatus });
                alert("Status sekatan akaun berjaya diubah!");
                searchPlayer();
            }
        }
    </script>
</body>
</html>
